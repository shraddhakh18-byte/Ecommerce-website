  <meta charset="UTF-8" />

  <title>My Ecommerce Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      padding: 20px;
      background: #111;
      color: white;
      text-align: center;
    }

    .hero {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff') center/cover no-repeat;
      color: white;
      padding: 20px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.6);
    }

    .hero p {
      font-size: 1.2rem;
      text-shadow: 0 2px 5px rgba(0,0,0,0.6);
    }

    .cta-btn {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 1.1rem;
      border: none;
      background: #ff6600;
      color: white;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.3s ease;
    }

    .cta-btn:hover {
      background: #e65600;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: #eee;
    }
  </style>
</head>

  <header>
    <h2>My Ecommerce Store</h2>
  </header>

  <section class="hero">
    <h1>Welcome to Your Online Shop</h1>
    <p>Discover amazing products with great deals.</p>
    
    <!-- Button redirecting to another website -->
    <button class="cta-btn" onclick="window.location.href='https://shradzhiremath-ui.github.io/Partner-website/'">
      Visit Our Partner Site
    </button>
  </section>

  <footer>
    <p>© 2025 My Ecommerce Store. All rights reserved.</p>
  </footer>
